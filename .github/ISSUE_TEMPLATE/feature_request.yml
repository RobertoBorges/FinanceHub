name: "💡 Feature Request"
description: "Suggest a new feature or enhancement for FinanceHub"
title: "[Feature Request]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a new feature! Please fill in the form below so we can understand your idea.

  - type: textarea
    id: problem
    attributes:
      label: "Problem Description"
      description: "What problem are you trying to solve? Is your feature request related to a frustration or limitation?"
      placeholder: "I'm always frustrated when... / It would be great if FinanceHub could..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "Describe the feature you would like to see. How should it work?"
      placeholder: "I would like FinanceHub to..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Have you considered any alternative approaches or workarounds?"
      placeholder: "I've tried... / Another approach could be..."
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: "Feature Category"
      description: "Which area of FinanceHub does this feature relate to?"
      options:
        - Portfolio Management
        - Market Data & Quotes
        - Performance Analytics
        - Alerts & Notifications
        - Import / Export
        - User Interface / UX
        - Authentication & Security
        - Integrations & APIs
        - Mobile Support
        - Reporting & Tax
        - Crypto / Digital Assets
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "How important is this feature to you?"
      options:
        - "🔴 Critical – I cannot use FinanceHub effectively without it"
        - "🟠 High – Would significantly improve my experience"
        - "🟡 Medium – Nice to have but I can work around it"
        - "🟢 Low – Minor improvement"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: "Additional Context"
      description: "Add any other context, screenshots, mockups, or links that help explain your request."
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "I have searched existing issues to make sure this is not a duplicate."
          required: true
        - label: "I understand this is a feature request, not a bug report."
          required: true
