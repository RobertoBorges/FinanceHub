name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior in FinanceHub"
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the form below so we can reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "When I do X, Y happens instead of Z..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "List the exact steps to reproduce the bug."
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      description: "What actually happened? Include error messages if available."
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots / Logs"
      description: "If applicable, add screenshots or logs to help explain the problem."
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: "FinanceHub Version"
      description: "Which version of FinanceHub are you using?"
      placeholder: "e.g., v1.2.3"
    validations:
      required: false

  - type: dropdown
    id: browser
    attributes:
      label: "Browser / Environment"
      description: "Which browser or environment are you using?"
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Mobile (iOS)
        - Mobile (Android)
        - Desktop App
        - Other
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: "Additional Context"
      description: "Any other context about the problem."
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "I have searched existing issues to make sure this is not a duplicate."
          required: true
        - label: "I have provided all the information needed to reproduce the bug."
          required: true
